# Calamares settings for Devuan non-systemd installations.
---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id: prepare-install-target
    module: shellprocess
    config: prepare-install-target.conf
  - id: configure-encrypted-unlock
    module: shellprocess
    config: configure-encrypted-unlock.conf
  - id: validate-installed-boot
    module: shellprocess
    config: validate-installed-boot.conf
  - id: cleanup-live-installer
    module: shellprocess
    config: cleanup-live-installer.conf
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec:
    - partition
    - mount
    - unpackfs
    - shellprocess@prepare-install-target
    - machineid
    - luksbootkeyfile
    - fstab
    - shellprocess@configure-encrypted-unlock
    - locale
    - keyboard
    - localecfg
    - removeuser
    - users
    - displaymanager
    - networkcfg
    - packages
    - hwclock
    - initramfscfg
    - initramfs
    - grubcfg
    - bootloader
    - shellprocess@validate-installed-boot
    - shellprocess@cleanup-live-installer
    - umount
  - show: [ finished ]
branding: deb-dev-modern
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
