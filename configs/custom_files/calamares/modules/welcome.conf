---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
# Suggest a language from the detected country, while keeping manual selection.
geoip:
  style: "xml"
  url: "https://geoip.kde.org/v1/ubiquity"
  selector: "CountryCode"
requirements:
  requiredStorage: 10
  requiredRam: 1.0
  check: [ storage, ram, power, root ]
  required: [ storage, ram, root ]
