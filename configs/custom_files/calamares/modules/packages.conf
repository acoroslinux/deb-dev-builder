# APT package operations for Debian and Devuan.
---
backend: apt
# Package cleanup must run even when installing offline; no repository update is requested.
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - remove:
    - calamares
    - live-boot
    - live-boot-doc
    - live-config
    - live-config-doc
    - live-tools
