# Debian/Devuan GRUB bootloader configuration.
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet", "splash" ]
# Debian's signed GRUB binary embeds /EFI/debian as its configuration prefix.
# Keep the installation directory aligned so installed systems find grub.cfg.
efiBootloaderId: "debian"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
installHybridGRUB: true
