# Debian Installer (d-i) Customization Preseed Configuration
# Place custom preseed answers, partitioning rules, locale, and package lists here.

d-i debian-installer/locale string pt_PT.UTF-8
d-i keyboard-configuration/xkb-keymap select pt
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Lisbon

# Network Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-modern
d-i netcfg/get_domain string local

# Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Live User
d-i passwd/username string liveuser

# Package Selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl wget fastfetch
d-i pkgsel/upgrade select full-upgrade

# Finish Installation
d-i finish-install/reboot_in_progress note
