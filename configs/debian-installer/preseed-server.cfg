# Debian Installer (d-i) Preseed Profile: Minimal Server NetInstall (No Tasksel)
# Bypasses tasksel completely to install an exact, ultra-lightweight headless server package selection.

d-i debian-installer/locale string pt_PT.UTF-8
d-i keyboard-configuration/xkb-keymap select pt
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Lisbon

# Network Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server
d-i netcfg/get_domain string local

# Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Server Admin
d-i passwd/username string admin

# --- BYPASS TASKSEL COMPLETELY ---
d-i tasksel/first multiselect none
d-i tasksel/tasks multiselect none
d-i base-installer/install-recommends boolean false

# Precise Minimal Server Package Selection
d-i pkgsel/include string openssh-server sudo curl wget fastfetch htop net-tools
d-i pkgsel/upgrade select full-upgrade

# Finish Installation & Reboot
d-i finish-install/reboot_in_progress note
