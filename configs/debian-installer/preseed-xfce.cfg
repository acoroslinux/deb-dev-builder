# Debian Installer Preseed Profile: XFCE NetInstall
# Installs a clean XFCE desktop while bypassing tasksel meta-packages.

d-i debian-installer/locale string pt_PT.UTF-8
d-i keyboard-configuration/xkb-keymap select pt
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Lisbon

# Network Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-xfce
d-i netcfg/get_domain string local

# Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Live User
d-i passwd/username string liveuser

# --- BYPASS TASKSEL META-PACKAGES ---
d-i tasksel/first multiselect none
d-i tasksel/tasks multiselect none
d-i base-installer/install-recommends boolean true

# Explicit Package Selection
d-i pkgsel/include string xfce4 xfce4-goodies lightdm network-manager-gnome sudo curl wget fastfetch pulseaudio firefox-esr
d-i pkgsel/upgrade select full-upgrade

# Finish Installation & Reboot
d-i finish-install/reboot_in_progress note
